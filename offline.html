    :root { --bg: #F7F3EA; --card: #ffffff; --text: #161616; --muted: #6c757d; --gold: #9d8248; }

    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;

      box-shadow: 0 14px 40px rgba(0,0,0,.08); border: 1px solid rgba(157,130,72,.2); }
    img { width: 84px; height: 84px; border-radius: 18px; }
    h1 { font-size: 21px; margin: 18px 0 6px; }
    p { margin: 0 0 20px; color: var(--muted); }
    button { border: 0; border-radius: 999px; padding: 12px 26px; font-weight: 700; font-size: 15px; cursor: pointer;
      background: var(--text); color: var(--bg); }
    .contact { margin-top: 20px; font-size: 13px; color: var(--muted); }
    .contact a { color: var(--gold); font-weight: 600; text-decoration: none; }
