<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Hairlux Admin — Announcements</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon" />
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />

    <link href="./assets/styles/tabler-flags.min.css" rel="stylesheet" />
    <link href="./assets/styles/tabler-socials.min.css" rel="stylesheet" />
    <link href="./assets/styles/tabler-payments.min.css" rel="stylesheet" />
    <link href="./assets/styles/tabler-vendors.min.css" rel="stylesheet" />
    <link href="./assets/styles/tabler-marketing.min.css" rel="stylesheet" />
    <link href="./assets/styles/tabler-themes.min.css" rel="stylesheet" />
    <link href="./assets/styles/navbar-left.css" rel="stylesheet" />
    <style>
        @import url("https://rsms.me/inter/inter.css");
        .spinner-inline { width: 1rem; height: 1rem; border-width: .15em; }
        table td { vertical-align: middle; }
    </style>
</head>

<body>
    <script src="./assets/js/config.js"></script>
    <script src="./assets/js/tabler-theme.min.js"></script>
    <div class="page">

        <header class="navbar navbar-expand-md d-print-none" data-bs-theme="dark">
            <div class="container-xl">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-menu" aria-controls="navbar-menu" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <a href="./index.html" class="navbar-brand navbar-brand-autodark">
                    <img src="assets/img/logo-side-white.webp" alt="" style="margin-right: 35px;" width="100px">
                </a>
                <div class="navbar-nav flex-row order-md-last">
                    <div class="nav-item me-2">
                        <a href="?theme=dark" class="nav-link px-0 hide-theme-dark" title="Enable dark mode"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon icon-1"><path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z" /></svg></a>
                        <a href="?theme=light" class="nav-link px-0 hide-theme-light" title="Enable light mode"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon icon-1"><path d="M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" /><path d="M3 12h1m8 -9v1m8 8h1m-9 8v1" /></svg></a>
                    </div>
                    <div class="nav-item dropdown">
                        <a href="#" class="nav-link d-flex lh-1 p-0 px-2" data-bs-toggle="dropdown">
                            <span class="avatar avatar-sm bg-primary text-white" id="navbar-user-avatar">A</span>
                            <div class="d-none d-xl-block ps-2">
                                <div id="navbar-user-name">Admin</div>
                                <div class="mt-1 small text-secondary" id="navbar-user-role">Administrator</div>
                            </div>
                        </a>
                        <div class="dropdown-menu dropdown-menu-end dropdown-menu-arrow" data-bs-theme="light">
                            <div class="dropdown-header">
                                <div class="fw-semibold" id="dropdown-user-name">Admin User</div>
                                <div class="text-secondary small text-truncate d-block" id="dropdown-user-email">admin.email</div>
                            </div>
                            <div class="dropdown-divider"></div>
                            <a href="./settings.html" class="dropdown-item">Settings</a>
                            <div class="dropdown-divider"></div>
                            <a href="#" id="logout-btn" class="dropdown-item text-danger">Logout</a>
                        </div>
                    </div>
                </div>
                <div class="collapse navbar-collapse" id="navbar-menu">
                    <ul class="navbar-nav" id="app-sidebar"></ul>
                    <script src="./assets/js/nav-config.js"></script>
                    <script src="./assets/js/layout.js"></script>
                    <script>Layout.init();</script>
                </div>
            </div>
        </header>

        <div class="page-wrapper">
            <div class="page-header d-print-none">
                <div class="container-xl">
                    <div class="row g-2 align-items-center">
                        <div class="col">
                            <div class="page-pretitle">Staff</div>
                            <h2 class="page-title">Announcements</h2>
                        </div>
                        <div class="col-auto ms-auto d-flex gap-2">
                            <button type="button" class="btn btn-outline-secondary" id="btn-refresh">Refresh</button>
                            <button type="button" class="btn btn-primary d-none" id="btn-add-announcement">New Announcement</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="page-body">
                <div class="container-xl">
                    <div id="page-alert" class="alert d-none mb-3" role="alert"></div>

                    <div class="card">
                        <div class="card-header d-block pb-0">
                            <div class="d-flex align-items-center justify-content-between mb-3">
                                <h3 class="card-title mb-0">All Announcements</h3>
                                <span class="text-secondary small" id="results-label">Loading…</span>
                            </div>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-vcenter table-hover card-table">
                                <thead><tr><th>Title</th><th>Audience</th><th>From</th><th>Sent</th></tr></thead>
                                <tbody id="announcements-tbody"><tr><td colspan="4" class="text-center py-5"><div class="spinner-border text-primary"></div></td></tr></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Announcement modal -->
    <div class="modal modal-blur fade" id="modal-announcement" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">New Announcement</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="alert alert-danger d-none mb-3" id="modal-announcement-error"></div>
                    <div class="mb-3">
                        <label class="form-label" for="announcement-title">Title <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="announcement-title" maxlength="200" placeholder="e.g. Public holiday closure — 3rd October">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="announcement-body">Message <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="announcement-body" rows="4" maxlength="5000" placeholder="e.g. All branches will be closed on Friday for the public holiday."></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Audience <span class="text-danger">*</span></label>
                        <select class="form-select" id="announcement-target">
                            <option value="ALL">All Staff</option>
                            <option value="BRANCH">A specific branch</option>
                            <option value="INDIVIDUAL">A specific staff member</option>
                        </select>
                    </div>
                    <div class="mb-3 d-none" id="announcement-branch-wrap">
                        <label class="form-label" for="announcement-branch">Branch <span class="text-danger">*</span></label>
                        <select class="form-select" id="announcement-branch"><option value="">Loading branches…</option></select>
                    </div>
                    <div class="mb-0 d-none" id="announcement-staff-wrap">
                        <label class="form-label" for="announcement-staff">Staff member <span class="text-danger">*</span></label>
                        <select class="form-select" id="announcement-staff"><option value="">Loading staff…</option></select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-link link-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="btn-save-announcement">Send Announcement</button>
                </div>
            </div>
        </div>
    </div>

    <script src="./assets/js/api-utils/auth.js"></script>
    <script src="./assets/js/api-utils/rbac.js"></script>
    <script src="./assets/js/api-utils/staff.js"></script>
    <script src="./assets/js/api-utils/staff-comms.js"></script>
    <script src="./assets/js/tabler.min.js"></script>
    <script>
        var bootstrap = window.tabler.bootstrap;

        Auth.requireAuth();
        RBAC.loadFromStorage();
        RBAC.applyPageGuardForCurrentPage();

        var _branchesLoaded = false;
        var _staffLoaded = false;
        var pageAlertTimer = null;

        function setPageAlert(type, message) {
            var el = document.getElementById("page-alert");
            if (!message) { el.className = "alert d-none mb-3"; el.textContent = ""; return; }
            el.className = "alert alert-" + type + " mb-3";
            el.textContent = message;
        }

        function flashPageAlert(type, message) {
            if (pageAlertTimer) { clearTimeout(pageAlertTimer); pageAlertTimer = null; }
            setPageAlert(type, message);
            if (!message) return;
            pageAlertTimer = setTimeout(function () { setPageAlert("", ""); pageAlertTimer = null; }, 5000);
        }

        function esc(s) {
            return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        function timeAgo(value) {
            if (!value) return "-";
            var d = new Date(value);
            if (isNaN(d.getTime())) return "-";
            var mins = Math.floor((Date.now() - d.getTime()) / 60000);
            if (mins < 60) return mins + "m ago";
            var hrs = Math.floor(mins / 60);
            if (hrs < 24) return hrs + "h ago";
            var days = Math.floor(hrs / 24);
            if (days < 7) return days + "d ago";
            return StaffComms.formatDate(value);
        }

        async function loadAnnouncements(options) {
            options = options || {};
            document.getElementById("results-label").textContent = "Loading…";
            try {
                var announcements = await StaffComms.getAllAnnouncements();
                var tbody = document.getElementById("announcements-tbody");
                if (!announcements.length) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center text-secondary py-4">No announcements have been sent yet.</td></tr>';
                } else {
                    tbody.innerHTML = announcements.map(function (a) {
                        return '<tr><td class="fw-semibold">' + esc(a.title) + '</td>' +
                            '<td><span class="badge bg-purple-lt">' + esc(StaffComms.announcementTargetLabel(a)) + '</span></td>' +
                            '<td>' + esc(StaffComms.createdByName(a)) + '</td>' +
                            '<td class="text-secondary small">' + timeAgo(a.createdAt) + '</td></tr>';
                    }).join("");
                }
                document.getElementById("results-label").textContent = announcements.length + " total";
                if (options.notifySuccess) flashPageAlert("success", "Refreshed.");
            } catch (e) {
                document.getElementById("announcements-tbody").innerHTML =
                    '<tr><td colspan="4" class="text-center text-danger py-4">' + esc(e.message || "Failed to load announcements.") + '</td></tr>';
                document.getElementById("results-label").textContent = "Error";
            }
        }

        async function ensureBranchesLoaded() {
            if (_branchesLoaded) return;
            try {
                var branches = await Staff.getLocations();
                var sel = document.getElementById("announcement-branch");
                sel.innerHTML = branches.map(function (b) {
                    return '<option value="' + b.id + '">' + esc(b.name) + '</option>';
                }).join("");
                _branchesLoaded = true;
            } catch (e) {
                flashPageAlert("danger", "Failed to load branches: " + (e.message || ""));
            }
        }

        async function ensureStaffLoaded() {
            if (_staffLoaded) return;
            try {
                var result = await Staff.getAll({ limit: 100 });
                var sel = document.getElementById("announcement-staff");
                sel.innerHTML = result.data.map(function (s) {
                    return '<option value="' + s.id + '">' + esc(Staff.fullName(s)) + ' (' + esc(s.staffCode || "") + ')</option>';
                }).join("");
                _staffLoaded = true;
            } catch (e) {
                flashPageAlert("danger", "Failed to load staff: " + (e.message || ""));
            }
        }

        function onTargetChange() {
            var target = document.getElementById("announcement-target").value;
            document.getElementById("announcement-branch-wrap").classList.toggle("d-none", target !== "BRANCH");
            document.getElementById("announcement-staff-wrap").classList.toggle("d-none", target !== "INDIVIDUAL");
            if (target === "BRANCH") ensureBranchesLoaded();
            if (target === "INDIVIDUAL") ensureStaffLoaded();
        }

        function openAnnouncementModal() {
            if (!RBAC.can(StaffComms.PERMISSIONS.MANAGE)) return;
            document.getElementById("modal-announcement-error").classList.add("d-none");
            document.getElementById("announcement-title").value = "";
            document.getElementById("announcement-body").value = "";
            document.getElementById("announcement-target").value = "ALL";
            onTargetChange();
            new bootstrap.Modal(document.getElementById("modal-announcement")).show();
        }

        async function saveAnnouncement() {
            var errEl = document.getElementById("modal-announcement-error");
            errEl.classList.add("d-none");

            var title = document.getElementById("announcement-title").value.trim();
            var body = document.getElementById("announcement-body").value.trim();
            var target = document.getElementById("announcement-target").value;
            var payload = { title: title, body: body, target: target };

            if (!title) { errEl.textContent = "Title is required."; errEl.classList.remove("d-none"); return; }
            if (!body) { errEl.textContent = "Message is required."; errEl.classList.remove("d-none"); return; }
            if (target === "BRANCH") {
                payload.targetLocationId = document.getElementById("announcement-branch").value;
                if (!payload.targetLocationId) { errEl.textContent = "Select a branch."; errEl.classList.remove("d-none"); return; }
            }
            if (target === "INDIVIDUAL") {
                payload.targetStaffId = document.getElementById("announcement-staff").value;
                if (!payload.targetStaffId) { errEl.textContent = "Select a staff member."; errEl.classList.remove("d-none"); return; }
            }

            var btn = document.getElementById("btn-save-announcement");
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-inline me-1"></span>Sending…';
            try {
                await StaffComms.createAnnouncement(payload);
                bootstrap.Modal.getInstance(document.getElementById("modal-announcement")).hide();
                flashPageAlert("success", "Announcement sent successfully.");
                loadAnnouncements();
            } catch (e) {
                var msg = e.message || "Failed to send announcement.";
                errEl.textContent = msg;
                errEl.classList.remove("d-none");
                flashPageAlert("danger", msg);
            } finally {
                btn.disabled = false;
                btn.textContent = "Send Announcement";
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            RBAC.fetchMe().then(function () {
                RBAC.applyPageGuardForCurrentPage();
                RBAC.applyNavVisibility();
                if (RBAC.can(StaffComms.PERMISSIONS.MANAGE)) {
                    document.getElementById("btn-add-announcement").classList.remove("d-none");
                }
            });

            document.getElementById("btn-refresh").addEventListener("click", function () { loadAnnouncements({ notifySuccess: true }); });
            document.getElementById("btn-add-announcement").addEventListener("click", openAnnouncementModal);
            document.getElementById("btn-save-announcement").addEventListener("click", saveAnnouncement);
            document.getElementById("announcement-target").addEventListener("change", onTargetChange);

            loadAnnouncements();
        });
    </script>
</body>
</html>
